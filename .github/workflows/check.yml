name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EMACS_VERSION: "30.1"
  EMACS_URL: https://ftpmirror.gnu.org/emacs/emacs-30.1.tar.xz
  EMACS_SHA256: 6ccac1ae76e6af93c6de1df175e8eb406767c23da3dd2a16aa67e3124a6f138f
  PYTHON_VERSION: "3.12.13"
  PYTHON_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20260807/cpython-3.12.13%2B20260807-x86_64-unknown-linux-gnu-install_only.tar.gz
  PYTHON_SHA256: 5bd6f36fd7ef02b909234c94dca9994ef0da06ace3bc3cece4fe27870e9cdbbe

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian13
            image: debian:13
            python: "3.13"
            emacs: "30.1"
            timeout: 45
          - name: ubuntu2604
            image: ubuntu:26.04
            timeout: 50
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    # Gate 35 + cold-cache Emacs build 5 (Ubuntu only) + setup allowance 10 minutes.
    # Setup covers packages, checkout, cache operations, Python installation and tool fetching.
    timeout-minutes: ${{ matrix.timeout }}
    env:
      QG_TOOLS_DIR: /tmp/qg-tools
    steps:
      - name: Install check tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 make git ca-certificates curl xz-utils libncurses6
      - name: Install Debian Emacs
        if: matrix.name == 'debian13'
        run: apt-get install -y --no-install-recommends emacs-nox
      - name: Restore pinned Emacs
        if: matrix.name == 'ubuntu2604'
        id: emacs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/qg-emacs
          key: ${{ matrix.image }}-${{ runner.arch }}-emacs-${{ env.EMACS_VERSION }}-${{ env.EMACS_SHA256 }}
      - name: Build pinned batch Emacs
        if: matrix.name == 'ubuntu2604' && steps.emacs-cache.outputs.cache-hit != 'true'
        # Measured 99 s (cold cache, ubuntu2604) on GitHub run 41136060160, bd3b0b9, 2026-10-30.
        # GitHub run 41173761182, b6ce8f6, 2026-10-31 skipped this build (cache hit); keep 99 s.
        # Rule: smallest multiple of 5 minutes at least 3 x largest recorded measurement / 60.
        # 3 x 99 s = 297 s; round up to a multiple of 5 minutes: 5 minutes.
        timeout-minutes: 5
        run: |
          apt-get install -y --no-install-recommends build-essential libncurses-dev pkg-config texinfo
          curl --fail --location --retry 3 "$EMACS_URL" -o /tmp/emacs.tar.xz
          actual=$(sha256sum /tmp/emacs.tar.xz)
          actual=${actual%% *}
          if [ "$actual" != "$EMACS_SHA256" ]; then
            printf 'Emacs SHA-256 mismatch: expected %s, actual %s\n' "$EMACS_SHA256" "$actual" >&2
            exit 1
          fi
          mkdir /tmp/emacs-build
          tar -xJf /tmp/emacs.tar.xz -C /tmp/emacs-build --strip-components=1
          cd /tmp/emacs-build
          ./configure --prefix=/opt/qg-emacs --without-all --without-x --without-native-compilation
          make -j"$(nproc)"
          make install
      - name: Restore pinned Python
        if: matrix.name == 'ubuntu2604'
        id: python-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/qg-python
          key: ${{ matrix.image }}-${{ runner.arch }}-python-${{ env.PYTHON_VERSION }}-${{ env.PYTHON_SHA256 }}
      - name: Install pinned standalone Python
        if: matrix.name == 'ubuntu2604' && steps.python-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 "$PYTHON_URL" -o /tmp/python.tar.gz
          actual=$(sha256sum /tmp/python.tar.gz)
          actual=${actual%% *}
          if [ "$actual" != "$PYTHON_SHA256" ]; then
            printf 'Python SHA-256 mismatch: expected %s, actual %s\n' "$PYTHON_SHA256" "$actual" >&2
            exit 1
          fi
          mkdir /opt/qg-python
          tar -xzf /tmp/python.tar.gz -C /opt/qg-python --strip-components=1
      - name: Use pinned Ubuntu runtimes
        if: matrix.name == 'ubuntu2604'
        run: |
          echo /opt/qg-emacs/bin >> "$GITHUB_PATH"
          echo /opt/qg-python/bin >> "$GITHUB_PATH"
      - name: Assert runtime versions
        env:
          EXPECTED_EMACS: ${{ matrix.emacs || env.EMACS_VERSION }}
          EXPECTED_PYTHON: ${{ matrix.python || env.PYTHON_VERSION }}
        run: |
          emacs --version
          python3 --version
          emacs -Q --batch --eval '(unless (equal emacs-version (getenv "EXPECTED_EMACS")) (kill-emacs 1))'
          python3 -c 'import os, sys; expected = os.environ["EXPECTED_PYTHON"]; actual = ".".join(map(str, sys.version_info[:len(expected.split("."))])); assert actual == expected, (expected, actual)'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.QG_TOOLS_DIR }}
          key: ${{ matrix.name }}-${{ runner.arch }}-${{ hashFiles('tools.lock.toml') }}
      - name: Fetch pinned tools
        run: python3 -I qg.py tools fetch
      - name: Run the gate
        # Measured 581 s (debian13) on GitHub run 41136060160, bd3b0b9, 2026-10-30.
        # Measured 576 s (ubuntu2604) on GitHub run 41136060160, bd3b0b9, 2026-10-30.
        # Measured 592 s (debian13) on GitHub run 41173761182, b6ce8f6, 2026-10-31.
        # Measured 641 s (ubuntu2604) on GitHub run 41173761182, b6ce8f6, 2026-10-31.
        # Rule: smallest multiple of 5 minutes at least 3 x largest recorded measurement / 60.
        # 3 x 641 s = 1923 s; round up to a multiple of 5 minutes: 35 minutes.
        timeout-minutes: 35
        run: make -k check

  mutation:
    runs-on: ubuntu-latest
    container: debian:13
    # Mutation step 270 + setup allowance 10 minutes for packages, checkout, cache and tool fetching.
    # The 280-minute job is within GitHub's 360-minute maximum for a hosted job.
    timeout-minutes: 280
    env:
      QG_TOOLS_DIR: /tmp/qg-tools
    steps:
      - name: Install test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 make git ca-certificates emacs-nox
          emacs --version
          python3 --version
          emacs -Q --batch --eval '(unless (equal emacs-version (getenv "EMACS_VERSION")) (kill-emacs 1))'
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.QG_TOOLS_DIR }}
          key: debian13-${{ runner.arch }}-${{ hashFiles('tools.lock.toml') }}
      - name: Fetch pinned tools
        run: python3 -I qg.py tools fetch
      - name: Mutation-test gate decisions
        # Mutations run the complete suite for each decision, with four isolated copies at a time.
        # Measured 3809 s on GitHub run 41136060160, bd3b0b9, 2026-10-30.
        # Measured 5308 s on GitHub run 41173761182, b6ce8f6, 2026-10-31.
        # Rule: smallest multiple of 5 minutes at least 3 x largest recorded measurement / 60.
        # 3 x 5308 s = 15924 s; round up to a multiple of 5 minutes: 270 minutes.
        timeout-minutes: 270
        run: make mutation
