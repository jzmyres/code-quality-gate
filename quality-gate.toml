schema = 2

[code]
patterns = ["*.py", "*.sh", "*.el"]
shebangs = ["sh", "bash", "python*"]

[hygiene]
max_bytes = 10485760

[levels]
required_tiers = [1]

[protect]
paths = ["ruff.toml"]

[classes.python]
code = true
description = "Python programs: the gate command itself"
checks = ["ruff", "clones", "tests", "crap", "verification"]

[classes.test]
code = true
description = "Python tests that execute the gate on fixture repositories"
checks = ["ruff", "clones", "tests", "verification"]

[classes.elisp]
code = true
description = "Emacs Lisp measurement helpers, measured by the gate's own Elisp checks"
checks = ["elisp-tests", "elisp-crap", "elisp-compile", "elisp-checkdoc"]

[classes.elisp-suite]
code = true
description = "The ERT suite that exercises the Emacs Lisp helpers"
checks = ["elisp-compile", "elisp-checkdoc"]

[classes.config]
code = false
description = "Configuration, lock files and ignore rules"

[classes.build]
code = false
description = "Self-check orchestration"

[classes.doc]
code = false
description = "Documentation and plans"

[[rule]]
pattern = "qg.py"
class = "python"
reason = "the entry point"

[[rule]]
pattern = "quality_gate/*.py"
class = "python"
reason = "the gate implementation, one module per concern"

[[rule]]
pattern = "quality_gate/elisp/*.el"
class = "elisp"
reason = "the gate's Emacs Lisp measurement helpers"

[[rule]]
pattern = "tests/*.py"
class = "test"
reason = "tests execute the gate against disposable fixture repositories"

[[rule]]
pattern = "tests/elisp/*.el"
class = "elisp-suite"
reason = "the ERT suite for the Emacs Lisp helpers, never instrumented"

[[rule]]
pattern = "Makefile"
class = "build"
reason = "the one check entry point"

[[rule]]
pattern = ".github/workflows/check.yml"
class = "build"
reason = "CI runs the self-check"

[[rule]]
pattern = "*.toml"
class = "config"
reason = "gate configuration and pinned tool data"

[[rule]]
pattern = "[!.]*.md"
class = "doc"
reason = "documentation and plans"

[[rule]]
pattern = ".agents/**"
class = "doc"
reason = "implementer agents' learned memory, written by the runner's reflection step"

[[rule]]
pattern = ".gitignore"
class = "config"
reason = "repository ignore rules"

[[rule]]
pattern = "LICENSE"
class = "doc"
reason = "AGPL-3.0 licence text"

[checks.ruff]
adapter = "command"
tier = 1
enforcement = "enforced"
run = ["{tool:ruff}", "check", "--no-cache", "--config", "ruff.toml", "{files}"]

[checks.clones]
adapter = "clones"
tier = 1
enforcement = "enforced"
min_tokens = 50
baseline = "quality-gate-clones.toml"

[checks.tests]
adapter = "python_tests"
tier = 1
enforcement = "enforced"
run = ["{python}", "-m", "unittest", "discover", "-s", "tests"]
tests_pattern = "^Ran (\\d+) tests? in"
skipped_pattern = "skipped=(\\d+)"

[checks.crap]
adapter = "python_crap"
tier = 1
enforcement = "enforced"
requires = "tests"
threshold = 6
baseline = "quality-gate-crap.toml"

[checks.verification]
adapter = "verification"
tier = 1
enforcement = "enforced"
requires = "tests"
baseline = "quality-gate-verification.toml"

[checks.elisp-tests]
adapter = "elisp_tests"
tier = 1
enforcement = "enforced"
suite = "tests/elisp/qg-elisp-tests.el"
load_path = ["quality_gate/elisp"]

[checks.elisp-crap]
adapter = "elisp_crap"
tier = 1
enforcement = "enforced"
requires = "elisp-tests"
threshold = 6
baseline = "quality-gate-elisp-crap.toml"

[checks.elisp-compile]
adapter = "elisp_compile"
tier = 1
enforcement = "enforced"
load_path = ["quality_gate/elisp"]

[checks.elisp-checkdoc]
adapter = "elisp_checkdoc"
tier = 1
enforcement = "enforced"
load_path = ["quality_gate/elisp"]

[[not_applicable]]
class = "elisp-suite"
tier = 1
reason = "the suite is run by the elisp-tests check and is never instrumented"
