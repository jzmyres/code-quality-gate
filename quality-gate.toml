schema = 2

[code]
patterns = ["*.py", "*.sh", "*.el"]
shebangs = ["sh", "bash", "python*"]

[hygiene]
max_bytes = 10485760

[levels]
required_tiers = [1]

[protect]
paths = ["ruff.toml"]

[classes.python]
code = true
description = "Python programs: the gate command itself"
checks = ["ruff", "clones", "tests", "crap", "shape", "variant-dispatch", "verification", "source-chars", "comments"]

[classes.test]
code = true
description = "Python tests that execute the gate on fixture repositories"
checks = ["ruff", "clones", "tests", "verification", "source-chars", "comments"]

[classes.elisp]
code = true
description = "Emacs Lisp measurement helpers, measured by the gate's own Elisp checks"
checks = ["elisp-tests", "elisp-crap", "elisp-compile", "elisp-checkdoc", "source-chars", "comments", "env_surface"]

[classes.elisp-suite]
code = true
description = "The ERT suite that exercises the Emacs Lisp helpers"
checks = ["elisp-compile", "elisp-checkdoc", "source-chars", "comments", "env_surface"]

[classes.config]
code = false
description = "Configuration, lock files and ignore rules"
checks = ["source-chars"]

[classes.build]
code = false
description = "Self-check orchestration"
checks = ["source-chars"]

[classes.doc]
code = false
description = "Documentation and plans"
checks = ["source-chars"]

[[rule]]
pattern = "qg.py"
class = "python"
reason = "the entry point"

[[rule]]
pattern = "quality_gate/*.py"
class = "python"
reason = "the gate implementation, one module per concern"

[[rule]]
pattern = "quality_gate/elisp/*.el"
class = "elisp"
reason = "the gate's Emacs Lisp measurement helpers"

[[rule]]
pattern = "tests/*.py"
class = "test"
reason = "tests execute the gate against disposable fixture repositories"

[[rule]]
pattern = "tests/elisp/*.el"
class = "elisp-suite"
reason = "the ERT suite for the Emacs Lisp helpers, never instrumented"

[[rule]]
pattern = "Makefile"
class = "build"
reason = "the one check entry point"

[[rule]]
pattern = ".github/workflows/check.yml"
class = "build"
reason = "CI runs the self-check"

[[rule]]
pattern = "*.toml"
class = "config"
reason = "gate configuration and pinned tool data"

[[rule]]
pattern = "[!.]*.md"
class = "doc"
reason = "documentation and plans"

[[rule]]
pattern = ".gitignore"
class = "config"
reason = "repository ignore rules"

[[rule]]
pattern = "LICENSE"
class = "doc"
reason = "AGPL-3.0 licence text"

[modules.core]
files = [
    "qg.py",
    "quality_gate/__init__.py",
    "quality_gate/adapters.py",
    "quality_gate/checks.py",
    "quality_gate/cli.py",
    "quality_gate/files.py",
    "quality_gate/gate_result.py",
    "quality_gate/json_input.py",
    "quality_gate/module_graph.py",
    "quality_gate/output_patterns.py",
    "quality_gate/payload.py",
    "quality_gate/policy.py",
    "quality_gate/ratchet.py",
    "quality_gate/regexrun.py",
    "quality_gate/runner.py",
    "quality_gate/tools.py",
    "quality_gate/trust.py",
    "quality_gate/worklist.py",
]
entry_points = [
    "quality_gate/adapters.py",
    "quality_gate/checks.py",
    "quality_gate/cli.py",
    "quality_gate/files.py",
    "quality_gate/json_input.py",
    "quality_gate/module_graph.py",
    "quality_gate/output_patterns.py",
    "quality_gate/payload.py",
    "quality_gate/policy.py",
    "quality_gate/ratchet.py",
    "quality_gate/runner.py",
    "quality_gate/tools.py",
    "quality_gate/trust.py",
    "quality_gate/worklist.py",
]
allowed_dependencies = ["python", "elisp", "other-adapters"]

[modules.python]
files = [
    "quality_gate/coverage_tool.py",
    "quality_gate/covrun.py",
    "quality_gate/python_crap.py",
    "quality_gate/python_mutation.py",
    "quality_gate/python_shape.py",
    "quality_gate/python_tests.py",
    "quality_gate/pytest_mutation_run.py",
    "quality_gate/test_shards.py",
    "quality_gate/variant_dispatch.py",
]
entry_points = [
    "quality_gate/coverage_tool.py",
    "quality_gate/python_crap.py",
    "quality_gate/python_mutation.py",
    "quality_gate/python_shape.py",
    "quality_gate/python_tests.py",
    "quality_gate/pytest_mutation_run.py",
    "quality_gate/variant_dispatch.py",
]
allowed_dependencies = ["core"]

[modules.elisp]
files = [
    "quality_gate/elisp_batch.py",
    "quality_gate/elisp_crap.py",
    "quality_gate/elisp_lint.py",
    "quality_gate/elisp_rules.py",
    "quality_gate/elisp_tests.py",
    "quality_gate/elisp/*.el",
]
entry_points = [
    "quality_gate/elisp_batch.py",
    "quality_gate/elisp_crap.py",
    "quality_gate/elisp_lint.py",
    "quality_gate/elisp_tests.py",
    "quality_gate/elisp/qg-elisp-child.el",
    "quality_gate/elisp/qg-elisp-complexity.el",
    "quality_gate/elisp/qg-elisp-lint.el",
    "quality_gate/elisp/qg-env-surface.el",
]
allowed_dependencies = ["core"]

[modules.other-adapters]
files = [
    "quality_gate/clones.py",
    "quality_gate/command.py",
    "quality_gate/comments.py",
    "quality_gate/env_surface.py",
    "quality_gate/secrets.py",
    "quality_gate/shell_syntax.py",
    "quality_gate/source_chars.py",
    "quality_gate/verification.py",
]
entry_points = [
    "quality_gate/clones.py",
    "quality_gate/command.py",
    "quality_gate/comments.py",
    "quality_gate/env_surface.py",
    "quality_gate/secrets.py",
    "quality_gate/shell_syntax.py",
    "quality_gate/source_chars.py",
    "quality_gate/verification.py",
]
allowed_dependencies = ["core", "elisp"]

[modules.tests]
files = ["tests/*.py", "tests/elisp/*.el"]
entry_points = []
allowed_dependencies = ["core", "python", "elisp", "other-adapters"]

[capabilities.run-quality-gate]
owner = "core"
entry_points = ["qg.py"]

[capabilities.run-coverage-driver]
owner = "python"
entry_points = ["quality_gate/covrun.py"]

[checks.module-contracts]
adapter = "module_contracts"
tier = 1
enforcement = "enforced"

[checks.ruff]
adapter = "command"
tier = 1
enforcement = "enforced"
run = ["{tool:ruff}", "check", "--no-cache", "--config", "ruff.toml", "{files}"]

[checks.clones]
adapter = "clones"
tier = 1
enforcement = "enforced"
min_tokens = 50

[checks.source-chars]
adapter = "source_chars"
tier = 1
enforcement = "enforced"

[checks.comments]
adapter = "comments"
tier = 1
enforcement = "enforced"

[checks.env_surface]
adapter = "env_surface"
tier = 1
enforcement = "enforced"
allow = [
    {name = "HOME", owner = "POSIX"},
    {name = "PATH", owner = "POSIX"},
    {name = "TMPDIR", owner = "POSIX"},
    {prefix = "XDG_", owner = "XDG Base Directory"},
    {name = "COVERAGE_CORE", owner = "coverage.py"},
    {name = "PYTHONDONTWRITEBYTECODE", owner = "Python"},
]

[checks.tests]
adapter = "python_tests"
tier = 1
enforcement = "enforced"
run = ["{python}", "quality_gate/test_shards.py", "-s", "tests"]
tests_pattern = "^Ran (\\d+) tests? in"
skipped_pattern = "skipped=(\\d+)"

[checks.crap]
adapter = "python_crap"
tier = 1
enforcement = "enforced"
requires = "tests"
threshold = 6

[checks.shape]
adapter = "python_shape"
tier = 1
enforcement = "enforced"
scope = "changed"
base = "HEAD"
crap_check = "crap"

[checks.variant-dispatch]
adapter = "variant_dispatch"
tier = 1
enforcement = "enforced"
scope = "tree"

[checks.verification]
adapter = "verification"
tier = 1
enforcement = "enforced"
requires = "tests"
baseline = "quality-gate-verification.toml"

[checks.elisp-tests]
adapter = "elisp_tests"
tier = 1
enforcement = "enforced"
suite = "tests/elisp/qg-elisp-tests.el"
load_path = ["quality_gate/elisp"]

[checks.elisp-crap]
adapter = "elisp_crap"
tier = 1
enforcement = "enforced"
requires = "elisp-tests"
threshold = 6

[checks.elisp-compile]
adapter = "elisp_compile"
tier = 1
enforcement = "enforced"
load_path = ["quality_gate/elisp"]

[checks.elisp-checkdoc]
adapter = "elisp_checkdoc"
tier = 1
enforcement = "enforced"
load_path = ["quality_gate/elisp"]

[[not_applicable]]
class = "elisp-suite"
tier = 1
reason = "the suite is run by the elisp-tests check and is never instrumented"
