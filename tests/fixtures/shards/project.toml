"review_crash.py" = '''
import os
import resource
import signal
import unittest


class CrashCase(unittest.TestCase):
    def test_a_completed(self):
        self.assertTrue(True)

    def test_b_crash(self):
        resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
        for number in range(60):
            os.write(1, f"fixture stdout {number:02d}\n".encode())
        print("fixture Python stdout before crash")
        os.write(2, b"fixture stderr before crash\n")
        signal.raise_signal(signal.SIGSEGV)

    def test_c_pending(self):
        self.fail("must not run after process crash")
'''

