"review_custom_run.py" = '''
import unittest


class ResourceCase(unittest.TestCase):
    def test_resource(self):
        self.assertTrue(self.ready)


class ResourceSuite(unittest.TestSuite):
    def run(self, result, debug=False):
        for test in self:
            test.ready = True
        return super().run(result, debug)


def load_tests(loader, standard_tests, pattern):
    return ResourceSuite(loader.loadTestsFromTestCase(ResourceCase))
'''

"review_custom_call.py" = '''
import unittest


class ResourceCase(unittest.TestCase):
    def test_resource(self):
        self.assertTrue(self.ready)


class CallableSuite(unittest.TestSuite):
    def __call__(self, result):
        for test in self:
            test.ready = True
        return super().__call__(result)


def load_tests(loader, standard_tests, pattern):
    return CallableSuite(loader.loadTestsFromTestCase(ResourceCase))
'''

