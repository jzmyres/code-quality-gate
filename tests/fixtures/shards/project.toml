"test_parameters.py" = '''
import unittest


def setUpModule():
    global ready
    ready = []


def tearDownModule():
    assert ready == [4, 9, 16]


class ParameterCase(unittest.TestCase):
    @classmethod
    def setUpClass(cls):
        cls.initialized = True

    def id(self):
        return f"{super().id()}.{self.value}"

    def test_square(self):
        self.assertTrue(self.initialized)
        ready.append(self.value ** 2)
        self.assertGreater(self.value, 0)
        self.value = 0


class FixtureCase(unittest.TestCase):
    def test_module_state(self):
        self.assertEqual(ready, [4, 9, 16])


def load_tests(loader, standard_tests, pattern):
    suite = unittest.TestSuite()
    for value in (2, 3, 4):
        test = ParameterCase("test_square")
        test.value = value
        suite.addTest(test)
    suite.addTests(loader.loadTestsFromTestCase(FixtureCase))
    return suite
'''

